name: Add new Bruno CLI lockfiles

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  add:
    name: Open a PR per new @usebruno/cli version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      # npm >= 11.10 is needed for --min-release-age; Node 24 bundles npm 11.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Generate lockfiles and open PRs
        env:
          GH_TOKEN: ${{ github.token }}
          COOLDOWN_DAYS: '2'
          # Comma-separated GitHub usernames to request review from. Teams
          # can't be requested with GITHUB_TOKEN; use CODEOWNERS for teams.
          LOCKFILE_REVIEWERS: ${{ vars.LOCKFILE_REVIEWERS }}
        run: |
          set -uo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          base="$(git rev-parse HEAD)"
          failures=()

          # Always a draft, never auto-merged: a human has to mark it ready and
          # merge it. Branch protection (see README) makes their approval
          # mandatory.
          open_pr() {
            local version="$1" branch="$2" pr_url
            pr_url="$(gh pr create --draft --base "${GITHUB_REF_NAME}" --head "${branch}" \
              --title "chore: add lockfile for @usebruno/cli ${version}" \
              --body "Adds \`lockfiles/${version}\`, generated by \`scripts/add-version.sh\` with a ${COOLDOWN_DAYS}-day release-age cooldown. Until this is merged and released, ${version} installs via the unlocked npm fallback; after that it installs from this lockfile.

          **Human review required.** This PR was opened by automation as a draft and must not be merged without a person reviewing it:

          - [ ] Compare the dependency tree with the previous lockfile (new, removed or bumped packages).
          - [ ] Check Dependabot alerts / \`npm audit\` for this lockfile.
          - [ ] Run the smoke tests (Actions → Smoke test → Run workflow on \`${branch}\`). PRs opened with \`GITHUB_TOKEN\` don't trigger them automatically.
          - [ ] Mark ready for review, approve, merge, then cut a release so \`@v1\` users get the lockfile.

          To decline this version, close the PR without deleting the branch; the workflow won't propose it again.")" || return 1

            if [ -z "${LOCKFILE_REVIEWERS}" ]; then
              echo "::warning::LOCKFILE_REVIEWERS repo variable is not set; no reviewers requested on ${pr_url}."
            elif ! gh pr edit "${pr_url}" --add-reviewer "${LOCKFILE_REVIEWERS}"; then
              echo "::warning::Could not request review from '${LOCKFILE_REVIEWERS}' on ${pr_url}."
            fi
          }

          # Each step is chained so a failure returns instead of exiting:
          # errexit doesn't apply inside a function called from `if`.
          lock_and_push() {
            local version="$1" branch="$2"
            git switch --quiet --detach "${base}" &&
              scripts/add-version.sh "${version}" &&
              git switch --quiet -c "${branch}" &&
              git add "lockfiles/${version}" &&
              git commit --quiet -m "chore: add lockfile for @usebruno/cli ${version}" &&
              git push --quiet origin "${branch}"
          }

          if ! versions="$(scripts/missing-versions.sh)"; then
            echo "::error::Could not list @usebruno/cli versions."
            exit 1
          fi
          if [ -z "${versions}" ]; then
            echo "No new @usebruno/cli versions past the ${COOLDOWN_DAYS}-day cooldown."
            exit 0
          fi

          for version in ${versions}; do
            branch="bruno-lockfile/${version}"
            echo "::group::${version}"

            if git ls-remote --exit-code --heads origin "${branch}" > /dev/null; then
              if [ -n "$(gh pr list --head "${branch}" --state all --json number --jq '.[].number')" ]; then
                echo "${branch} already has a PR (open, merged or closed); skipping."
              else
                echo "${branch} exists without a PR (an earlier run failed); opening one."
                open_pr "${version}" "${branch}" || failures+=("${version}")
              fi
            elif lock_and_push "${version}" "${branch}"; then
              open_pr "${version}" "${branch}" || failures+=("${version}")
            else
              echo "::error::Could not generate or push a lockfile for ${version}."
              failures+=("${version}")
              git switch --quiet --force --detach "${base}"
              git clean -fdq -- lockfiles
            fi

            echo "::endgroup::"
          done

          if [ "${#failures[@]}" -gt 0 ]; then
            echo "::error::Failed for: ${failures[*]}. Other versions were still processed."
            exit 1
          fi
